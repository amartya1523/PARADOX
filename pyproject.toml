[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paradox-db"
version = "0.1.0"
description = "PARADOX - a causal-temporal what-if database for infrastructure digital twins"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Amartya Vikram Singh" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
paradox = "paradox.cli:main"

[tool.setuptools.packages.find]
include = ["paradox*"]

[tool.setuptools.package-data]
paradox = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
